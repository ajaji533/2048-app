name: Lab05 Vercel CD

on:
  push:
    branches: [lab5]
  pull_request:
    branches: [lab5]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.28.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Debug Vercel output
        run: |
          pwd
          ls -la
          find .vercel -maxdepth 3 -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2048-app-build
          path: .vercel/output
          retention-days: 1
          if-no-files-found: error

  preview_deploy:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-build
          path: .vercel/output

      - name: Debug downloaded artifact
        run: |
          pwd
          ls -la
          find .vercel -maxdepth 4 -type f | sort

      - name: Deploy preview to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  production_deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-build
          path: .vercel/output

      - name: Debug downloaded artifact
        run: |
          pwd
          ls -la
          find .vercel -maxdepth 4 -type f | sort

      - name: Deploy production to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --yes --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}